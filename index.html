<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Forza Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      :root{
        --bg:#0a0a0a;--surface:#141414;--surface2:#1c1c1c;--border:#252525;
        --blue:#3b82f6;--blue-h:#2563eb;--green:#22c55e;--green-h:#16a34a;
        --t1:#f5f5f5;--t2:#a0a0a0;--t3:#666;
        --r:14px;--rs:10px;
      }
      html,body{background:var(--bg);color:var(--t1);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}
      body{padding-top:env(safe-area-inset-top);padding-bottom:calc(env(safe-area-inset-bottom)+20px)}
      a{color:inherit;text-decoration:none}

      /* ---- HEADER ---- */
      .hdr{position:sticky;top:0;z-index:50;backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);background:rgba(10,10,10,.78);border-bottom:1px solid var(--border)}
      .hdr-inner{max-width:1200px;margin:0 auto;padding:14px 20px;display:flex;align-items:center;justify-content:space-between}
      .hdr-left{display:flex;align-items:center;gap:10px}
      .hdr-icon{width:32px;height:32px;background:linear-gradient(135deg,var(--blue),#8b5cf6);border-radius:9px;display:flex;align-items:center;justify-content:center}
      .hdr-title{font-size:1.15rem;font-weight:800;letter-spacing:-.03em}
      .hdr-badge{background:var(--blue);color:#fff;font-size:.65rem;font-weight:800;padding:3px 9px;border-radius:99px}
      .hdr-sub{font-size:.7rem;color:var(--t3);margin-left:42px;margin-top:-2px;padding-bottom:2px}
      @media(max-width:600px){.hdr-sub{display:none}}

      /* ---- GRID ---- */
      .wrap{max-width:1200px;margin:0 auto;padding:16px 16px 0}
      .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
      @media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:16px}}
      @media(min-width:1000px){.grid{grid-template-columns:repeat(4,1fr);gap:18px}}

      /* ---- CARD ---- */
      .card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden;transition:transform .2s,border-color .2s,box-shadow .2s;display:flex;flex-direction:column}
      .card:hover{transform:translateY(-3px);border-color:rgba(59,130,246,.4);box-shadow:0 12px 40px rgba(0,0,0,.5)}
      .card-img-wrap{position:relative;overflow:hidden;cursor:pointer;aspect-ratio:16/9;background:#000}
      .card-img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
      .card:hover .card-img{transform:scale(1.05)}
      .card-overlay{position:absolute;inset:0;background:linear-gradient(180deg,transparent 40%,rgba(0,0,0,.6));opacity:0;transition:opacity .25s;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px}
      .card:hover .card-overlay{opacity:1}
      .card-hint{font-size:.65rem;font-weight:600;color:rgba(255,255,255,.85);background:rgba(0,0,0,.45);padding:4px 10px;border-radius:99px;backdrop-filter:blur(4px)}
      .card-bar{display:flex;gap:1px;overflow:hidden;border-top:1px solid var(--border)}
      .card-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:9px 0;font-size:.68rem;font-weight:700;color:#fff;border:none;cursor:pointer;transition:background .12s}
      .card-btn svg{width:12px;height:12px;flex-shrink:0}
      .btn-sv{background:var(--surface2)}
      .btn-sv:hover{background:var(--green)}
      .btn-sv.saving{background:var(--t3);pointer-events:none}
      .btn-fs{background:var(--surface2)}
      .btn-fs:hover{background:var(--blue)}

      /* ---- LIGHTBOX ---- */
      .lb{display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);flex-direction:column;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s}
      .lb.open{display:flex}
      .lb-img{max-width:92%;max-height:72vh;border-radius:var(--r);box-shadow:0 24px 80px rgba(0,0,0,.7);object-fit:contain}
      .lb-bar{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
      .lb-btn{display:inline-flex;align-items:center;gap:7px;padding:11px 22px;font-size:.8rem;font-weight:700;border:none;border-radius:var(--rs);cursor:pointer;transition:all .15s;text-decoration:none;color:#fff}
      .lb-btn svg{width:15px;height:15px}
      .lb-save{background:var(--green)}.lb-save:hover{background:var(--green-h)}
      .lb-open{background:var(--blue)}.lb-open:hover{background:var(--blue-h)}
      .lb-close-btn{background:rgba(255,255,255,.08)}.lb-close-btn:hover{background:rgba(255,255,255,.15)}
      .lb-x{position:absolute;top:14px;right:14px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.08);border:none;color:#fff;font-size:18px;cursor:pointer;transition:background .15s}
      .lb-x:hover{background:rgba(255,255,255,.18)}

      /* ---- STATES ---- */
      .state{min-height:50vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
      .state-ico{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 14px}
      .state-ico-err{background:rgba(239,68,68,.12)}
      .state-ico-mt{background:rgba(160,160,160,.08)}
      .state-h{font-size:1rem;font-weight:700;margin-bottom:4px}
      .state-p{font-size:.78rem;color:var(--t3);max-width:240px;margin:0 auto;line-height:1.5}
      .btn-retry{margin-top:14px;padding:9px 24px;font-size:.78rem;font-weight:700;border:1px solid var(--border);background:transparent;color:var(--t1);border-radius:var(--rs);cursor:pointer;transition:all .15s}
      .btn-retry:hover{background:rgba(255,255,255,.05);border-color:var(--t3)}

      /* ---- SKELETON ---- */
      .skel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);overflow:hidden}
      .skel-img{aspect-ratio:16/9;background:linear-gradient(90deg,#141414 0%,#1e1e1e 50%,#141414 100%);background-size:200% 100%;animation:shm 1.5s ease infinite}
      .skel-bar{height:34px;border-top:1px solid var(--border);background:linear-gradient(90deg,#141414 0%,#1e1e1e 50%,#141414 100%);background-size:200% 100%;animation:shm 1.5s ease infinite;animation-delay:.15s}
      @keyframes shm{0%{background-position:200% 0}100%{background-position:-200% 0}}
      @keyframes fadeIn{from{opacity:0}to{opacity:1}}
      @keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
      .card{animation:slideUp .35s ease both}

      /* ---- FOOTER ---- */
      .ft{text-align:center;padding:20px 0 28px;font-size:.68rem;color:var(--t3)}
      .d-none{display:none!important}
    </style>
  </head>
  <body>
    <header class="hdr">
      <div class="hdr-inner">
        <div class="hdr-left">
          <div class="hdr-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 00-2 2v9a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
          </div>
          <span class="hdr-title">Forza Gallery</span>
        </div>
        <span id="badge" class="hdr-badge d-none"></span>
      </div>
      <div class="hdr-inner" style="padding-top:0;padding-bottom:10px">
        <span class="hdr-sub">Tap a photo to preview &middot; Save directly to your camera roll</span>
      </div>
    </header>

    <div class="wrap">
      <main id="app">
        <div id="loading" class="grid">
          <div class="skel"><div class="skel-img"></div><div class="skel-bar"></div></div>
          <div class="skel"><div class="skel-img"></div><div class="skel-bar"></div></div>
          <div class="skel"><div class="skel-img"></div><div class="skel-bar"></div></div>
          <div class="skel"><div class="skel-img"></div><div class="skel-bar"></div></div>
          <div class="skel"><div class="skel-img"></div><div class="skel-bar"></div></div>
          <div class="skel"><div class="skel-img"></div><div class="skel-bar"></div></div>
        </div>

        <div id="error" class="state d-none">
          <div>
            <div class="state-ico state-ico-err">&#9888;&#65039;</div>
            <div class="state-h">Could not load photos</div>
            <p id="error-message" class="state-p">Something went wrong.</p>
            <button id="retry-btn" class="btn-retry">Try again</button>
          </div>
        </div>

        <div id="empty" class="state d-none">
          <div>
            <div class="state-ico state-ico-mt">&#128248;</div>
            <div class="state-h">No photos yet</div>
            <p class="state-p">Sync your screenshots from forza.net using the console script.</p>
          </div>
        </div>

        <div id="grid" class="grid d-none"></div>
      </main>
      <footer class="ft"><span id="count"></span></footer>
    </div>

    <div id="lightbox" class="lb">
      <button id="lb-x" class="lb-x" aria-label="Close">&times;</button>
      <img id="lb-img" class="lb-img" src="" alt="Preview" />
      <div class="lb-bar">
        <button id="lb-save" class="lb-btn lb-save">
          <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Save to Photos
        </button>
        <a id="lb-open" class="lb-btn lb-open" href="#" target="_blank" rel="noopener noreferrer">Open Full Size</a>
        <button id="lb-close2" class="lb-btn lb-close-btn">Close</button>
      </div>
    </div>

    <script>
      const API_BASE_URL = "https://forza-gallery-api.onrender.com";
      const $ = id => document.getElementById(id);
      const els = {
        loading:$("loading"), error:$("error"), errorMsg:$("error-message"),
        empty:$("empty"), grid:$("grid"), count:$("count"), badge:$("badge"),
        retry:$("retry-btn"), lb:$("lightbox"), lbImg:$("lb-img"),
        lbOpen:$("lb-open"), lbSave:$("lb-save"), lbX:$("lb-x"), lbClose2:$("lb-close2"),
      };
      let currentFull = "";
      const show = el => el.classList.remove("d-none");
      const hide = el => el.classList.add("d-none");
      const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

      async function savePhoto(url, btn) {
        const orig = btn ? btn.innerHTML : "";
        if (btn) { btn.innerHTML = "Saving…"; btn.classList.add("saving"); }
        try {
          const r = await fetch(url); const blob = await r.blob();
          const file = new File([blob], "forza-photo.jpg", { type: blob.type });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: "Forza Screenshot" });
            if (btn) { btn.innerHTML = "Saved!"; setTimeout(() => { btn.innerHTML = orig; btn.classList.remove("saving"); }, 2000); }
            return;
          }
          const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
          a.download = "forza-photo.jpg"; document.body.appendChild(a); a.click();
          document.body.removeChild(a); URL.revokeObjectURL(a.href);
          if (btn) { btn.innerHTML = "Saved!"; setTimeout(() => { btn.innerHTML = orig; btn.classList.remove("saving"); }, 2000); }
        } catch (e) {
          window.open(url, "_blank");
          if (btn) { btn.innerHTML = orig; btn.classList.remove("saving"); }
        }
      }

      function openLb(thumb, full) {
        els.lbImg.src = thumb; els.lbOpen.href = full; currentFull = full;
        els.lb.classList.add("open"); document.body.style.overflow = "hidden";
      }
      function closeLb() { els.lb.classList.remove("open"); document.body.style.overflow = ""; els.lbImg.src = ""; }
      els.lbX.addEventListener("click", closeLb);
      els.lbClose2.addEventListener("click", closeLb);
      els.lbSave.addEventListener("click", () => savePhoto(currentFull, els.lbSave));
      els.lb.addEventListener("click", e => { if (e.target === els.lb) closeLb(); });
      document.addEventListener("keydown", e => { if (e.key === "Escape") closeLb(); });

      function renderPhotos(photos) {
        els.grid.innerHTML = photos.map((p, i) => {
          const thumb = esc(p.thumbnail || p.url), full = esc(p.url);
          return `<div class="card" style="animation-delay:${Math.min(i * .04, .4).toFixed(2)}s">
            <div class="card-img-wrap" data-thumb="${thumb}" data-full="${full}">
              <img class="card-img" src="${thumb}" alt="Forza screenshot" loading="lazy" decoding="async"/>
              <div class="card-overlay"><span class="card-hint">Tap to preview</span></div>
            </div>
            <div class="card-bar">
              <button class="card-btn btn-sv" onclick="savePhoto('${full}',this)">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Save
              </button>
              <a class="card-btn btn-fs" href="${full}" target="_blank" rel="noopener noreferrer">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>
                Full Size
              </a>
            </div>
          </div>`;
        }).join("");
        els.grid.querySelectorAll(".card-img-wrap").forEach(el => {
          el.addEventListener("click", () => openLb(el.dataset.thumb, el.dataset.full));
        });
      }

      async function loadPhotos() {
        hide(els.error); hide(els.empty); hide(els.grid); hide(els.badge); show(els.loading);
        try {
          const res = await fetch(`${API_BASE_URL}/api/photos`, { headers: { Accept: "application/json" } });
          if (!res.ok) { let d=`HTTP ${res.status}`; try{const j=await res.json();if(j.error)d=j.error}catch(_){} throw new Error(d); }
          const data = await res.json(); const photos = (data && data.photos) || [];
          hide(els.loading);
          if (!photos.length) { show(els.empty); els.count.textContent = ""; return; }
          renderPhotos(photos); show(els.grid);
          els.badge.textContent = photos.length; show(els.badge);
          els.count.textContent = `${photos.length} photo${photos.length===1?"":"s"} from Forza Motorsport 6`;
        } catch (err) { hide(els.loading); els.errorMsg.textContent = err?.message || "Unknown error"; show(els.error); }
      }
      els.retry.addEventListener("click", loadPhotos);
      loadPhotos();
    </script>
  </body>
</html>
