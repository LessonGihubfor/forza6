<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
    <meta name="theme-color" content="#0a0a0a"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
    <meta name="description" content="Forza Motorsport 6 Screenshot Gallery"/>
    <link rel="manifest" href="manifest.json"/>
    <link rel="apple-touch-icon" href="icon-192.png"/>
    <title>Forza Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      :root{--bg:#0a0a0a;--s1:#141414;--s2:#1c1c1c;--bd:#252525;--blue:#3b82f6;--blue-h:#2563eb;--green:#22c55e;--green-h:#16a34a;--t1:#f5f5f5;--t2:#a0a0a0;--t3:#666;--r:14px;--rs:10px}
      html,body{background:var(--bg);color:var(--t1);font-family:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;-webkit-font-smoothing:antialiased}
      body{padding-top:env(safe-area-inset-top);padding-bottom:calc(env(safe-area-inset-bottom)+20px)}
      a{color:inherit;text-decoration:none}
      .d-none{display:none!important}

      /* HEADER */
      .hdr{position:sticky;top:0;z-index:50;backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);background:rgba(10,10,10,.82);border-bottom:1px solid var(--bd)}
      .hdr-in{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
      .hdr-icon{width:34px;height:34px;background:linear-gradient(135deg,var(--blue),#8b5cf6);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
      .hdr-t{font-size:1.15rem;font-weight:800;letter-spacing:-.03em;flex:1}
      .hdr-badge{background:var(--blue);color:#fff;font-size:.65rem;font-weight:800;padding:3px 9px;border-radius:99px}
      .hdr-actions{display:flex;gap:8px;align-items:center}
      .btn-save-all{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;font-size:.72rem;font-weight:700;color:#fff;background:var(--green);border:none;border-radius:var(--rs);cursor:pointer;transition:background .15s}
      .btn-save-all:hover{background:var(--green-h)}
      .btn-save-all:disabled{background:var(--t3);pointer-events:none}
      .btn-save-all svg{width:13px;height:13px}

      /* MASONRY GRID */
      .wrap{max-width:1400px;margin:0 auto;padding:16px 16px 0}
      .masonry{columns:2;column-gap:12px}
      @media(min-width:640px){.masonry{columns:3;column-gap:14px}}
      @media(min-width:960px){.masonry{columns:4;column-gap:16px}}
      @media(min-width:1280px){.masonry{columns:5;column-gap:16px}}

      /* CARD */
      .card{break-inside:avoid;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:12px;transition:transform .2s,border-color .2s,box-shadow .2s;animation:slideUp .35s ease both}
      @media(min-width:640px){.card{margin-bottom:14px}}
      .card:hover{transform:translateY(-3px);border-color:rgba(59,130,246,.35);box-shadow:0 12px 40px rgba(0,0,0,.5)}
      .card-w{position:relative;overflow:hidden;cursor:pointer}
      .card-img{width:100%;display:block;background:#111;transition:transform .35s}
      .card:hover .card-img{transform:scale(1.04)}
      .card-ov{position:absolute;inset:0;background:linear-gradient(180deg,transparent 50%,rgba(0,0,0,.6));opacity:0;transition:opacity .25s;display:flex;align-items:flex-end;justify-content:center;padding-bottom:10px}
      .card:hover .card-ov,.card-w:active .card-ov{opacity:1}
      .card-h{font-size:.6rem;font-weight:600;color:rgba(255,255,255,.85);background:rgba(0,0,0,.45);padding:3px 9px;border-radius:99px;backdrop-filter:blur(4px)}
      .card-bar{display:flex;border-top:1px solid var(--bd)}
      .card-btn{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:8px 0;font-size:.64rem;font-weight:700;color:#ccc;background:var(--s2);border:none;cursor:pointer;transition:all .12s}
      .card-btn:first-child{border-right:1px solid var(--bd)}
      .card-btn svg{width:11px;height:11px;flex-shrink:0}
      .card-btn:hover{color:#fff;background:var(--s1)}
      .card-btn.saving{color:var(--t3);pointer-events:none}

      /* LIGHTBOX */
      .lb{display:none;position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);flex-direction:column;align-items:center;justify-content:center;padding:16px;animation:fadeIn .15s;touch-action:none}
      .lb.open{display:flex}
      .lb-img{max-width:94%;max-height:74vh;border-radius:var(--r);box-shadow:0 24px 80px rgba(0,0,0,.7);object-fit:contain;user-select:none;-webkit-user-drag:none}
      .lb-counter{font-size:.7rem;color:var(--t3);margin-top:8px;font-weight:600}
      .lb-bar{margin-top:12px;display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
      .lb-btn{display:inline-flex;align-items:center;gap:6px;padding:10px 20px;font-size:.78rem;font-weight:700;border:none;border-radius:var(--rs);cursor:pointer;transition:all .15s;text-decoration:none;color:#fff}
      .lb-btn svg{width:14px;height:14px}
      .lb-sv{background:var(--green)}.lb-sv:hover{background:var(--green-h)}
      .lb-op{background:var(--blue)}.lb-op:hover{background:var(--blue-h)}
      .lb-gh{background:rgba(255,255,255,.08)}.lb-gh:hover{background:rgba(255,255,255,.15)}
      .lb-x{position:absolute;top:14px;right:14px;width:38px;height:38px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.08);border:none;color:#fff;font-size:18px;cursor:pointer;transition:background .15s;z-index:5}
      .lb-x:hover{background:rgba(255,255,255,.18)}
      .lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;display:flex;align-items:center;justify-content:center;border-radius:50%;background:rgba(255,255,255,.08);border:none;color:#fff;font-size:22px;cursor:pointer;transition:background .15s;z-index:5}
      .lb-nav:hover{background:rgba(255,255,255,.2)}
      .lb-prev{left:12px}.lb-next{right:12px}
      @media(max-width:600px){.lb-nav{width:36px;height:36px;font-size:18px}.lb-prev{left:6px}.lb-next{right:6px}}

      /* STATES */
      .state{min-height:50vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:40px 20px}
      .state-ico{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 14px}
      .state-ico-err{background:rgba(239,68,68,.12)}.state-ico-mt{background:rgba(160,160,160,.08)}
      .state-h{font-size:1rem;font-weight:700;margin-bottom:4px}
      .state-p{font-size:.78rem;color:var(--t3);max-width:240px;margin:0 auto;line-height:1.5}
      .btn-retry{margin-top:14px;padding:9px 24px;font-size:.78rem;font-weight:700;border:1px solid var(--bd);background:transparent;color:var(--t1);border-radius:var(--rs);cursor:pointer;transition:all .15s}
      .btn-retry:hover{background:rgba(255,255,255,.05);border-color:var(--t3)}

      /* SKELETON */
      .skel{break-inside:avoid;background:var(--s1);border:1px solid var(--bd);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
      .skel-img{background:linear-gradient(90deg,#141414 0%,#1e1e1e 50%,#141414 100%);background-size:200% 100%;animation:shm 1.5s ease infinite}
      .skel-s{height:140px}.skel-m{height:180px}.skel-l{height:220px}
      .skel-bar{height:32px;border-top:1px solid var(--bd);background:linear-gradient(90deg,#141414 0%,#1e1e1e 50%,#141414 100%);background-size:200% 100%;animation:shm 1.5s ease infinite;animation-delay:.15s}
      @keyframes shm{0%{background-position:200% 0}100%{background-position:-200% 0}}
      @keyframes fadeIn{from{opacity:0}to{opacity:1}}
      @keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

      .ft{text-align:center;padding:20px 0 28px;font-size:.68rem;color:var(--t3)}
    </style>
  </head>
  <body>
    <header class="hdr">
      <div class="hdr-in">
        <div class="hdr-icon">
          <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" fill="none" viewBox="0 0 24 24" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4h-5L7 7H4a2 2 0 00-2 2v9a2 2 0 002 2h16a2 2 0 002-2V9a2 2 0 00-2-2h-3l-2.5-3z"/><circle cx="12" cy="13" r="3"/></svg>
        </div>
        <span class="hdr-t">Forza Gallery</span>
        <div class="hdr-actions">
          <span id="badge" class="hdr-badge d-none"></span>
          <button id="save-all-btn" class="btn-save-all d-none">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
            Save All
          </button>
        </div>
      </div>
    </header>

    <div class="wrap">
      <main id="app">
        <div id="loading" class="masonry">
          <div class="skel"><div class="skel-img skel-l"></div><div class="skel-bar"></div></div>
          <div class="skel"><div class="skel-img skel-s"></div><div class="skel-bar"></div></div>
          <div class="skel"><div class="skel-img skel-m"></div><div class="skel-bar"></div></div>
          <div class="skel"><div class="skel-img skel-l"></div><div class="skel-bar"></div></div>
          <div class="skel"><div class="skel-img skel-s"></div><div class="skel-bar"></div></div>
          <div class="skel"><div class="skel-img skel-m"></div><div class="skel-bar"></div></div>
          <div class="skel"><div class="skel-img skel-l"></div><div class="skel-bar"></div></div>
          <div class="skel"><div class="skel-img skel-s"></div><div class="skel-bar"></div></div>
        </div>
        <div id="error" class="state d-none"><div>
          <div class="state-ico state-ico-err">&#9888;&#65039;</div>
          <div class="state-h">Could not load photos</div>
          <p id="error-message" class="state-p">Something went wrong.</p>
          <button id="retry-btn" class="btn-retry">Try again</button>
        </div></div>
        <div id="empty" class="state d-none"><div>
          <div class="state-ico state-ico-mt">&#128248;</div>
          <div class="state-h">No photos yet</div>
          <p class="state-p">Sync your screenshots from forza.net using the console script.</p>
        </div></div>
        <div id="grid" class="masonry d-none"></div>
      </main>
      <footer class="ft"><span id="count"></span></footer>
    </div>

    <!-- LIGHTBOX WITH SLIDESHOW -->
    <div id="lightbox" class="lb">
      <button id="lb-x" class="lb-x" aria-label="Close">&times;</button>
      <button id="lb-prev" class="lb-nav lb-prev" aria-label="Previous">&#8249;</button>
      <button id="lb-next" class="lb-nav lb-next" aria-label="Next">&#8250;</button>
      <img id="lb-img" class="lb-img" src="" alt="Preview"/>
      <div id="lb-counter" class="lb-counter"></div>
      <div class="lb-bar">
        <button id="lb-save" class="lb-btn lb-sv">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Save
        </button>
        <a id="lb-open" class="lb-btn lb-op" href="#" target="_blank" rel="noopener noreferrer">Full Size</a>
        <button id="lb-close2" class="lb-btn lb-gh">Close</button>
      </div>
    </div>

    <script>
      const API = "https://forza-gallery-api.onrender.com";
      const $ = id => document.getElementById(id);
      const show = el => el.classList.remove("d-none");
      const hide = el => el.classList.add("d-none");
      const esc = s => String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

      const els = {
        loading:$("loading"),error:$("error"),errorMsg:$("error-message"),empty:$("empty"),
        grid:$("grid"),count:$("count"),badge:$("badge"),retry:$("retry-btn"),
        saveAll:$("save-all-btn"),
        lb:$("lightbox"),lbImg:$("lb-img"),lbOpen:$("lb-open"),lbSave:$("lb-save"),
        lbX:$("lb-x"),lbClose2:$("lb-close2"),lbPrev:$("lb-prev"),lbNext:$("lb-next"),
        lbCounter:$("lb-counter"),
      };

      let allPhotos = [];
      let lbIdx = 0;

      // ---- SAVE PHOTO ----
      async function savePhoto(url, btn) {
        const orig = btn ? btn.innerHTML : "";
        if (btn) { btn.innerHTML = "Saving…"; btn.classList.add("saving"); }
        try {
          const r = await fetch(url); const blob = await r.blob();
          const file = new File([blob], "forza-photo.jpg", { type: blob.type });
          if (navigator.canShare && navigator.canShare({ files: [file] })) {
            await navigator.share({ files: [file], title: "Forza Screenshot" });
            if (btn) { btn.innerHTML = "Saved!"; setTimeout(()=>{btn.innerHTML=orig;btn.classList.remove("saving")},2000); }
            return;
          }
          const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
          a.download = "forza-photo.jpg"; document.body.appendChild(a); a.click();
          document.body.removeChild(a); URL.revokeObjectURL(a.href);
          if (btn) { btn.innerHTML = "Saved!"; setTimeout(()=>{btn.innerHTML=orig;btn.classList.remove("saving")},2000); }
        } catch(e) {
          window.open(url,"_blank");
          if (btn) { btn.innerHTML=orig; btn.classList.remove("saving"); }
        }
      }

      // ---- SAVE ALL ----
      async function saveAllPhotos() {
        const btn = els.saveAll;
        const orig = btn.innerHTML;
        btn.disabled = true;
        for (let i = 0; i < allPhotos.length; i++) {
          btn.innerHTML = `Saving ${i+1}/${allPhotos.length}…`;
          try {
            const r = await fetch(allPhotos[i].full || allPhotos[i].url);
            const blob = await r.blob();
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = `forza-${i+1}.jpg`;
            document.body.appendChild(a); a.click();
            document.body.removeChild(a); URL.revokeObjectURL(a.href);
          } catch(e) { console.error("Failed to save photo",i+1,e); }
          await new Promise(r => setTimeout(r, 400));
        }
        btn.innerHTML = "All Saved!";
        setTimeout(()=>{ btn.innerHTML=orig; btn.disabled=false; },3000);
      }
      els.saveAll.addEventListener("click", saveAllPhotos);

      // ---- LIGHTBOX SLIDESHOW ----
      function showLb(idx) {
        if (idx < 0 || idx >= allPhotos.length) return;
        lbIdx = idx;
        const p = allPhotos[idx];
        els.lbImg.src = p.thumbnail || p.url;
        els.lbOpen.href = p.full || p.url;
        els.lbCounter.textContent = `${idx+1} / ${allPhotos.length}`;
        els.lb.classList.add("open");
        document.body.style.overflow = "hidden";
        els.lbPrev.style.display = idx > 0 ? "" : "none";
        els.lbNext.style.display = idx < allPhotos.length-1 ? "" : "none";
      }
      function closeLb() { els.lb.classList.remove("open"); document.body.style.overflow=""; els.lbImg.src=""; }
      els.lbX.addEventListener("click", closeLb);
      els.lbClose2.addEventListener("click", closeLb);
      els.lbSave.addEventListener("click", ()=> savePhoto(allPhotos[lbIdx]?.full || allPhotos[lbIdx]?.url, els.lbSave));
      els.lbPrev.addEventListener("click", ()=> showLb(lbIdx-1));
      els.lbNext.addEventListener("click", ()=> showLb(lbIdx+1));
      els.lb.addEventListener("click", e=>{ if(e.target===els.lb) closeLb(); });
      document.addEventListener("keydown", e=>{
        if (!els.lb.classList.contains("open")) return;
        if (e.key==="Escape") closeLb();
        if (e.key==="ArrowLeft") showLb(lbIdx-1);
        if (e.key==="ArrowRight") showLb(lbIdx+1);
      });
      // Swipe support for mobile
      let touchStartX = 0;
      els.lb.addEventListener("touchstart", e=>{ touchStartX=e.changedTouches[0].screenX; },{passive:true});
      els.lb.addEventListener("touchend", e=>{
        const dx = e.changedTouches[0].screenX - touchStartX;
        if (Math.abs(dx) > 50) { dx > 0 ? showLb(lbIdx-1) : showLb(lbIdx+1); }
      },{passive:true});

      // ---- RENDER ----
      function renderPhotos(photos) {
        els.grid.innerHTML = photos.map((p,i) => {
          const thumb = esc(p.thumbnail||p.url), full = esc(p.full||p.url);
          return `<div class="card" style="animation-delay:${Math.min(i*.03,.5).toFixed(2)}s">
            <div class="card-w" data-idx="${i}">
              <img class="card-img" src="${thumb}" alt="Forza screenshot" loading="lazy" decoding="async"/>
              <div class="card-ov"><span class="card-h">Tap to preview</span></div>
            </div>
            <div class="card-bar">
              <button class="card-btn" onclick="savePhoto('${full}',this)">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>Save
              </button>
              <a class="card-btn" href="${full}" target="_blank" rel="noopener noreferrer">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>Full Size
              </a>
            </div>
          </div>`;
        }).join("");
        els.grid.querySelectorAll(".card-w").forEach(el=>{
          el.addEventListener("click",()=> showLb(parseInt(el.dataset.idx)));
        });
      }

      // ---- LOAD ----
      async function loadPhotos() {
        hide(els.error);hide(els.empty);hide(els.grid);hide(els.badge);hide(els.saveAll);show(els.loading);
        try {
          const res = await fetch(`${API}/api/photos?max=200`,{headers:{Accept:"application/json"}});
          if(!res.ok){let d=`HTTP ${res.status}`;try{const j=await res.json();if(j.error)d=j.error}catch(_){}throw new Error(d)}
          const data = await res.json();
          allPhotos = (data&&data.photos)||[];
          hide(els.loading);
          if(!allPhotos.length){show(els.empty);els.count.textContent="";return}
          renderPhotos(allPhotos);show(els.grid);
          els.badge.textContent=allPhotos.length;show(els.badge);show(els.saveAll);
          els.count.textContent=`${allPhotos.length} photo${allPhotos.length===1?"":"s"} from Forza Motorsport 6`;
        } catch(err){hide(els.loading);els.errorMsg.textContent=err?.message||"Unknown error";show(els.error)}
      }
      els.retry.addEventListener("click",loadPhotos);
      loadPhotos();

      // ---- PWA SERVICE WORKER ----
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.register("sw.js").catch(()=>{});
      }
    </script>
  </body>
</html>
